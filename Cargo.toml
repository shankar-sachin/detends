[workspace]
resolver = "2"
members = [
  "crates/detends-motion",
  "crates/detends-native",
  "crates/detends-fs",
  "crates/detends-paint",
  "crates/detends-render",
  "crates/detends-time",
  "crates/detends-shell",
  "crates/detends-host",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["détends"]

[workspace.dependencies]
detends-motion = { path = "crates/detends-motion" }
detends-native = { path = "crates/detends-native" }
detends-fs     = { path = "crates/detends-fs" }
detends-paint  = { path = "crates/detends-paint" }
detends-render = { path = "crates/detends-render" }
detends-time   = { path = "crates/detends-time" }
detends-shell  = { path = "crates/detends-shell" }

wgpu        = "30.0.1"
winit       = "0.30.13"
glyphon     = "0.12.0"
cosmic-text = "0.19.0"
bytemuck    = { version = "1.25", features = ["derive"] }
pollster    = "1.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
jiff        = { version = "0.2.37", features = ["serde"] }
directories = "6.0"
log         = "0.4"
env_logger  = "0.11"

# Perceived performance is a feature (§21): debug builds must still feel alive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
